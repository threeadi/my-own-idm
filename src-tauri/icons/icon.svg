<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="45%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>

    <!-- Outer Perimeter Micro-Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.45" />
    </linearGradient>

    <!-- Radial Cyan Luminescence Field -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.38" />
      <stop offset="48%" stop-color="#2563eb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Kinetic Electric Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#e0fbff" />
      <stop offset="20%" stop-color="#00e5ff" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Lightning Spark Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cffafe" />
      <stop offset="70%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Base Cradle Gradient -->
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="25%" stop-color="#00e5ff" />
      <stop offset="75%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Drop Shadow for Dimensionality -->
    <filter id="depthShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- 1. Deep Obsidian Squircle Shell -->
  <rect x="10" y="10" width="492" height="492" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- 2. Ambient Luminescence Field -->
  <rect x="14" y="14" width="484" height="484" rx="108" ry="108" fill="url(#ambientGlow)" />

  <!-- 3. Base Receiving Tray / Telemetry Cradle (Bottom) -->
  <g filter="url(#depthShadow)">
    <path d="M 98 296 L 98 376 C 98 404 122 428 152 428 L 360 428 C 390 428 414 404 414 376 L 414 296" 
          fill="none" 
          stroke="url(#trayGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Telemetry Pulse LED -->
    <circle cx="256" cy="428" r="7" fill="#10b981" />
    <circle cx="256" cy="428" r="14" fill="#10b981" fill-opacity="0.45" />
  </g>

  <!-- 4. Upper Speed Chevrons (Supersonic Inflow) -->
  <g filter="url(#depthShadow)">
    <!-- Top Micro Chevron -->
    <path d="M 204 84 L 256 124 L 308 84" 
          fill="none" 
          stroke="#00e5ff" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-opacity="0.65" />

    <!-- Second Speed Chevron -->
    <path d="M 180 118 L 256 174 L 332 118" 
          fill="none" 
          stroke="url(#arrowGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- 5. Core Turbo Arrow (Bold, Aerodynamic & Lightning-Infused) -->
  <g filter="url(#depthShadow)">
    <!-- Main Arrowhead Body -->
    <path d="M 212 160 
             L 300 160 
             L 300 244 
             L 388 244 
             L 256 376 
             L 124 244 
             L 212 244 
             Z" 
          fill="url(#arrowGrad)" />

    <!-- Sleek High-Contrast Lightning Energy Slice -->
    <path d="M 272 172 
             L 226 256 
             L 264 256 
             L 236 338 
             L 298 242 
             L 260 242 
             L 286 172 
             Z" 
          fill="url(#lightningGrad)" />

    <!-- Specular Highlight Tip -->
    <polygon points="256,376 246,360 266,360" fill="#ffffff" />
  </g>
</svg>
