<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Own IDM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 340px; background: #090d16; color: #f1f5f9; padding: 14px; font-size: 12px; }
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #1e293b; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: #38bdf8; }
    .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 10px; border-radius: 10px; border: 1px solid #1e293b; margin-bottom: 14px; }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #06b6d4; }
    input:checked + .slider:before { transform: translateX(16px); }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 8px; }
    .media-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .media-item { background: #0f172a; border: 1px solid #1e293b; padding: 8px 10px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .media-info { min-width: 0; flex: 1; }
    .media-url { font-size: 11px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-tag { font-size: 9px; color: #38bdf8; font-family: monospace; }
    .btn-dl { background: #06b6d4; color: #090d16; border: none; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; transition: 0.2s; shrink: 0; }
    .btn-dl:hover { background: #22d3ee; }
    .empty-state { text-align: center; padding: 16px 0; color: #475569; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon16.png" width="16" height="16" alt="IDM Turbo" style="border-radius: 4px;" />
      <span>IDM Turbo</span>
    </div>
    <span class="badge" id="status-badge">Active</span>
  </div>

  <div class="toggle-row">
    <div>
      <div style="font-weight: 600;">Capture Downloads</div>
      <div style="font-size: 10px; color: #64748b;">Intercept clicks automatically</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="interceptor-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-title">Detected Media on Page</div>
  <div class="media-list" id="media-container">
    <div class="empty-state">No video or audio stream detected on this page.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
