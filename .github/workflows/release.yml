name: Automated Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run check
          npm run test
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Package Browser Extension (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path extension/* -DestinationPath idm-turbo-extension.zip -Force
          Write-Host "Extension packaged to idm-turbo-extension.zip"

      - name: Build Tauri Desktop (.exe & NSIS installer)
        run: npm run tauri build

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          # Copy standalone binary to root artifact area with recognizable name
          Copy-Item "src-tauri/target/release/idm-turbo-desktop.exe" -Destination "idm-turbo-desktop-portable.exe"
          
          # Find generated NSIS setup installer
          $setupExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName -Destination "idm-turbo-desktop-setup.exe"
            Write-Host "Found installer: $($setupExe.Name) -> copied to idm-turbo-desktop-setup.exe"
          }

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: IDM Turbo Desktop ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            idm-turbo-desktop-setup.exe
            idm-turbo-desktop-portable.exe
            idm-turbo-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
